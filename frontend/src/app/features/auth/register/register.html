<div class="login-container">

    <div class="login-card">

        <h1>Imigram</h1>
        <p>Kreiraj nalog</p>


        <input 
            id="username"
            type="text"
            placeholder="Username"
            [(ngModel)]="username">


        <input 
            id="email"
            type="email"
            placeholder="Email"
            [(ngModel)]="email">


        <input 
            id="password"
            type="password"
            placeholder="Lozinka"
            [(ngModel)]="password">


        <input 
            id="confirm-password"
            type="password"
            placeholder="Potvrdi lozinku"
            [(ngModel)]="confirmPassword">


        <input 
            id="firstName"
            type="text"
            placeholder="Ime"
            [(ngModel)]="firstName">


        <input 
            id="lastName"
            type="text"
            placeholder="Prezime"
            [(ngModel)]="lastName">


        <input 
            id="img"
            type="file"
            (change)="onFileSelected($event)">

        <div *ngIf="errorMessage()" class="error-message">
            {{ errorMessage() }}
        </div>

        <button id="register-button" (click)="register()">
            Registruj se
        </button>


    </div>

</div>
