<div class="login-container">
    <div class="login-card">
        <h1>Imigram</h1>
        <p>Prijavi se na svoj nalog</p>
        <input [(ngModel)]="username" id="username" type="text" placeholder="Username">

        <input [(ngModel)]="password" id="password" type="password" placeholder="Lozinka">

        <div *ngIf="errorMessage()" class="error-message">
            {{ errorMessage() }}
        </div>
        <button id="login-button" (click)="login()">Login</button>

        <a href="http://localhost:4200/register">
            Nemate nalog? Registrujte se
        </a>
    </div>
</div>
